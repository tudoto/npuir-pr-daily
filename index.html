<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AscendNPU-IR PR 每日合入报告</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Noto Sans CJK SC", "WenQuanYi Micro Hei", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f0f2f5;
    color: #333;
    line-height: 1.6;
  }
  .hero {
    background: linear-gradient(135deg, #0c2d6b 0%, #1e5bb8 50%, #2d8cf0 100%);
    color: #fff;
    padding: 60px 24px 48px;
    text-align: center;
  }
  .hero h1 { font-size: 32px; margin-bottom: 12px; }
  .hero .subtitle { font-size: 16px; opacity: .85; margin-bottom: 24px; }
  .hero .repo-link {
    display: inline-block;
    padding: 8px 20px;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 6px;
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    transition: background .2s;
  }
  .hero .repo-link:hover { background: rgba(255,255,255,.25); }
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 48px;
    margin-top: 32px;
    flex-wrap: wrap;
  }
  .stat-item { text-align: center; }
  .stat-item .num { font-size: 28px; font-weight: 700; }
  .stat-item .label { font-size: 13px; opacity: .7; }

  .container { max-width: 900px; margin: -32px auto 48px; padding: 0 24px; }
  .section-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 20px;
    padding-left: 12px;
    border-left: 4px solid #1e5bb8;
  }
  .report-card {
    background: #fff;
    border-radius: 10px;
    padding: 24px 28px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    transition: transform .15s, box-shadow .15s;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .report-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,.12);
  }
  .report-card .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .report-card .date {
    font-size: 22px;
    font-weight: 700;
    color: #1e5bb8;
  }
  .report-card .pr-count {
    background: #1e5bb8;
    color: #fff;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
  }
  .report-card .pr-count.zero { background: #94a3b8; }
  .report-card .authors {
    font-size: 13px;
    color: #666;
    margin-bottom: 8px;
  }
  .report-card .authors span {
    display: inline-block;
    background: #e8edf3;
    padding: 2px 10px;
    border-radius: 4px;
    margin-right: 6px;
    margin-bottom: 4px;
  }
  .report-card .highlights {
    font-size: 13px;
    color: #555;
    line-height: 1.8;
  }
  .report-card .highlights li {
    list-style: none;
    padding-left: 16px;
    position: relative;
  }
  .report-card .highlights li::before {
    content: "▸";
    position: absolute;
    left: 0;
    color: #1e5bb8;
  }
  .report-card .arrow {
    color: #1e5bb8;
    font-size: 14px;
    margin-top: 12px;
    font-weight: 500;
  }
  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: #888;
  }
  .loading {
    text-align: center;
    padding: 60px;
    color: #888;
  }
  .footer {
    text-align: center;
    padding: 32px;
    color: #888;
    font-size: 13px;
  }
  .footer a { color: #1e5bb8; text-decoration: none; }
</style>
</head>
<body>

<div class="hero">
  <h1>AscendNPU-IR PR 每日合入报告</h1>
  <p class="subtitle">每日自动追踪 GitCode 仓库 AscendNPU-IR 的 Pull Request 合入情况</p>
  <a class="repo-link" href="https://gitcode.com/Ascend/AscendNPU-IR" target="_blank">🔗 仓库地址：Ascend/AscendNPU-IR</a>
  <div class="nav-links" style="margin-top:16px;">
    <a class="repo-link" href="pass-pipeline.html" style="margin-right:12px;">📖 Pass Pipeline</a>
    <a class="repo-link" href="cv-pipeline.html" style="margin-right:12px;">⚡ CV Pipeline</a>
  </div>
  <div class="stats-bar" id="statsBar">
    <div class="stat-item"><div class="num" id="totalDays">-</div><div class="label">已收录天数</div></div>
    <div class="stat-item"><div class="num" id="totalPRs">-</div><div class="label">累计 PR 数</div></div>
    <div class="stat-item"><div class="num" id="latestDate">-</div><div class="label">最近报告</div></div>
  </div>
</div>

<div class="container">
  <div class="section-title">日报归档</div>
  <div id="reportList">
    <div class="loading">加载中…</div>
  </div>
</div>

<div class="footer">
  数据来源：<a href="https://gitcode.com/Ascend/AscendNPU-IR" target="_blank">GitCode AscendNPU-IR</a> ·
  自动生成 · 每日更新
</div>

<script>
fetch('reports.json')
  .then(r => r.json())
  .then(data => {
    const reports = data.reports || [];
    reports.sort((a, b) => b.date.localeCompare(a.date));

    // stats
    const totalPRs = reports.reduce((s, r) => s + (r.totalPRs || 0), 0);
    document.getElementById('totalDays').textContent = reports.length;
    document.getElementById('totalPRs').textContent = totalPRs;
    document.getElementById('latestDate').textContent = reports.length ? reports[0].date : '-';

    const list = document.getElementById('reportList');
    if (reports.length === 0) {
      list.innerHTML = '<div class="empty-state">暂无报告</div>';
      return;
    }

    list.innerHTML = reports.map(r => `
      <a class="report-card" href="${r.filename}">
        <div class="card-header">
          <span class="date">📅 ${r.date}</span>
          <span class="pr-count ${r.totalPRs === 0 ? 'zero' : ''}">${r.totalPRs} 笔 PR</span>
        </div>
        ${r.authors && r.authors.length ? `<div class="authors">${r.authors.map(m => `<span>${m}</span>`).join('')}</div>` : ''}
        ${r.highlights && r.highlights.length ? `<ul class="highlights">${r.highlights.map(h => `<li>${h}</li>`).join('')}</ul>` : ''}
        <div class="arrow">查看完整报告 →</div>
      </a>
    `).join('');
  })
  .catch(err => {
    document.getElementById('reportList').innerHTML = '<div class="empty-state">数据加载失败，请确保 reports.json 存在。</div>';
  });
</script>

</body>
</html>
